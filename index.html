<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Nav Lead Parser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #0a66c2;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 10px;
      padding: 10px 24px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #084e96;
    }
    #output {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- Tab Buttons -->
<div style="margin-bottom:24px;">
  <button onclick="showTab('parser')" id="tab-parser" style="padding:10px 24px;background:#0a66c2;color:white;border:none;border-radius:6px 0 0 6px;font-size:15px;cursor:pointer;">📋 Sales Nav Parser</button>
  <button onclick="showTab('cleaner')" id="tab-cleaner" style="padding:10px 24px;background:#ccc;color:#333;border:none;border-radius:0 6px 6px 0;font-size:15px;cursor:pointer;">🧹 Full Enrich Cleaner</button>
</div>

<!-- Tab 1: Sales Nav Parser -->
<div id="tab-parser-content">
  <h1>Sales Nav Lead Parser</h1>
  <p>Paste your raw Sales Navigator copy below, then hit Parse.</p>

  <label style="font-weight:bold; font-size:14px;">Assign to Rep:</label>
<br>
<select id="repSelect" style="margin-bottom:12px; margin-top:4px; padding:8px 12px; font-size:14px; border:1px solid #ccc; border-radius:6px; width:300px;">
  <option value="">-- Select a Rep --</option>
  <option value="katharina.tkatchenko@nutrient.io">Katharina Tkatchenko</option>
  <option value="richard@nutrient.io">Richard Malloy</option>
  <option value="ney.costa@nutrient.io">Ney Costa</option>
  <option value="brandon.iturralde@nutrient.io">Brandon Iturralde</option>
  <option value="huw.kimber@nutrient.io">Huw Kimber</option>
  <option value="reinaldo.barreiros@nutrient.io">Reinaldo Barreiros</option>
  <option value="harry.bradyturner@nutrient.io">Harry Brady-Turner</option>
  <option value="alex.fal@nutrient.io">Alex Fal</option>
  <option value="abeer.alaydi@nutrient.io">Abeer Alaydi</option>
  <option value="caslin.lau@nutrient.io">Caslin Lau</option>
  <option value="maria.hussion@nutrient.io">Maria Hussion</option>
</select>
<br>
<textarea id="rawInput" placeholder="Paste Sales Nav data here..."></textarea>
<br>
<button onclick="parseLeads()">Parse Leads</button>
<div id="output"></div>
<div id="tableContainer" style="overflow-x:auto; margin-top:20px;"></div>
<div id="downloadBtn" style="margin-top:10px;"></div>
</div><!-- end tab-parser-content -->

<!-- Tab 2: Full Enrich Cleaner -->
<div id="tab-cleaner-content" style="display:none;">
  <h1>Full Enrich CSV Cleaner</h1>
  <p>Upload your Full Enrich CSV and we'll format it for Salesforce import.</p>

  <label style="font-weight:bold; font-size:14px;">Assign to Rep:</label>
  <br>
  <select id="repSelectCleaner" style="margin-bottom:12px; margin-top:4px; padding:8px 12px; font-size:14px; border:1px solid #ccc; border-radius:6px; width:300px;">
    <option value="">-- Select a Rep --</option>
    <option value="katharina.tkatchenko@nutrient.io">Katharina Tkatchenko</option>
    <option value="richard@nutrient.io">Richard Malloy</option>
    <option value="ney.costa@nutrient.io">Ney Costa</option>
    <option value="brandon.iturralde@nutrient.io">Brandon Iturralde</option>
    <option value="huw.kimber@nutrient.io">Huw Kimber</option>
    <option value="reinaldo.barreiros@nutrient.io">Reinaldo Barreiros</option>
    <option value="harry.bradyturner@nutrient.io">Harry Brady-Turner</option>
    <option value="alex.fal@nutrient.io">Alex Fal</option>
    <option value="abeer.alaydi@nutrient.io">Abeer Alaydi</option>
    <option value="caslin.lau@nutrient.io">Caslin Lau</option>
    <option value="maria.hussion@nutrient.io">Maria Hussion</option>
  </select>
  <br>
  <label style="font-weight:bold; font-size:14px;">Override Company Name (optional):</label>
<br>
<input type="text" id="accountNameOverride" placeholder="e.g. Network Rail (leave blank to use CSV values)" style="margin-bottom:12px; margin-top:4px; padding:8px 12px; font-size:14px; border:1px solid #ccc; border-radius:6px; width:400px;">
<br>
<input type="file" id="csvFileInput" accept=".csv" style="margin-bottom:12px; font-size:14px;">
  <br>
  <button onclick="cleanCSV()" style="padding:10px 24px;background:#0a66c2;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;">🧹 Clean CSV</button>

  <div id="cleanerOutput" style="margin-top:20px;"></div>
  <div id="cleanerTable" style="overflow-x:auto; margin-top:20px;"></div>
  <div id="cleanerDownload" style="margin-top:10px;"></div>
</div>
  <script>
  function parseLeads() {
    var raw = document.getElementById("rawInput").value;
    var repEmail = document.getElementById("repSelect").value;
    var accountOverride = document.getElementById("accountNameOverride").value.trim();
    if (!repEmail) {
      alert("Please select a rep before parsing!");
      return;
    }
    var lines = raw.split("\n").map(function(l) { return l.trim(); });

    // Split into per-lead blocks
    var blocks = [];
    var current = [];

    for (var i = 0; i < lines.length; i++) {
      if (lines[i].match(/^Select /i) && current.length > 0) {
        blocks.push(current);
        current = [];
      }
      current.push(lines[i]);
    }
    if (current.length > 0) blocks.push(current);

    // Parse each block
    var results = [];

    blocks.forEach(function(b) {
      var name = b[1] || "";

      var connection = "";
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/^(1st|2nd|3rd)$/i)) { connection = b[i]; break; }
      }

      var lists = "";
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/\d+\s+Lists?$/i)) { lists = b[i]; break; }
      }

      var crmStatus = "";
      var crmIndex = -1;
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/CRM/i)) {
          crmStatus = b[i];
          crmIndex = i;
          break;
        }
      }
      if (crmIndex > 0 && b[crmIndex - 1] === "!") {
        crmStatus = "! " + crmStatus;
      }

      var title = "", company = "", extras = "", location = "";
      if (crmIndex !== -1) {
        var afterCRM = [];
        var junk = ["saved badge", "add account", "open the account matching modal to add an account"];
        for (var i = crmIndex + 1; i < b.length; i++) {
          if (b[i].match(/^Add note$/i)) break;
          if (b[i] !== "" && !junk.includes(b[i].toLowerCase())) afterCRM.push(b[i]);
        }
        title   = (afterCRM[0] || "").replace(/^:\s*/, "");
        company = afterCRM[1] || "";
        if (afterCRM.length >= 3 && afterCRM[2].match(/^\(\+\d+\)$/)) {
          extras   = afterCRM[2];
          location = afterCRM[3] || "";
        } else {
          location = afterCRM[2] || "";
        }
      }

      var activity = "", date = "";
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/^No activity$/i)) {
          activity = b[i];
          for (var j = i + 1; j < b.length; j++) {
            if (b[j] !== "") { date = b[j]; break; }
          }
          break;
        }
      }

      var nameParts = name.split(" ");
var firstName = nameParts[0] || "";
var lastName = nameParts.slice(1).join(" ") || "";
results.push({ firstName, lastName, connection, title, company, extras, location, lists, crmStatus, activity, date, leadSource: "Outbound Prospecting", repEmail: repEmail });
    });
    // Store results globally for CSV download later
    window.parsedLeads = results;

    document.getElementById("output").innerHTML = "<p>✅ Parsed <strong>" + results.length + " leads</strong> successfully!</p>";

    // Build table
    var headers = ["First Name","Last Name","Connection","Title","Company","Extra Companies","Location","Lists","CRM Status","Activity","Last Activity Date","LeadSource", "Lead Owner Email"];
    var html = "<table style='border-collapse:collapse; width:100%; font-size:13px;'>";
    html += "<tr>" + headers.map(function(h) {
      return "<th style='background:#0a66c2;color:white;padding:8px 12px;text-align:left;white-space:nowrap;'>" + h + "</th>";
    }).join("") + "</tr>";

    results.forEach(function(r, idx) {
      var bg = idx % 2 === 0 ? "#ffffff" : "#f0f4ff";
      html += "<tr style='background:" + bg + ";'>";
     html += ["firstName","lastName","connection","title","company","extras","location","lists","crmStatus","activity","date","leadSource", "repEmail"].map(function(k) {
        return "<td style='padding:8px 12px;border-bottom:1px solid #ddd;white-space:nowrap;'>" + (r[k] || "") + "</td>";
      }).join("");
      html += "</tr>";
    });
    html += "</table>";
    document.getElementById("tableContainer").innerHTML = html;

    // Build download button
    document.getElementById("downloadBtn").innerHTML = "<button onclick='downloadCSV()' style='padding:10px 24px;background:#00a36c;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;'>⬇️ Download CSV</button>";
  }
function downloadCSV() {
    var headers = ["First Name","Last Name","Connection","Title","Company","Extra Companies","Location","Lists","CRM Status","Activity","Last Activity Date","LeadSource", "Lead Owner Email"];
    var keys = ["firstName","lastName","connection","title","company","extras","location","lists","crmStatus","activity","date","leadSource", "repEmail"];
    var csv = headers.join(",") + "\n";
    window.parsedLeads.forEach(function(r) {
      csv += keys.map(function(k) {
        return '"' + (r[k] || "").replace(/"/g, '""') + '"';
      }).join(",") + "\n";
    });
    var blob = new Blob([csv], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "salesnav_leads.csv";
    a.click();
  }
    function showTab(tab) {
    document.getElementById('tab-parser-content').style.display = tab === 'parser' ? 'block' : 'none';
    document.getElementById('tab-cleaner-content').style.display = tab === 'cleaner' ? 'block' : 'none';
    document.getElementById('tab-parser').style.background = tab === 'parser' ? '#0a66c2' : '#ccc';
    document.getElementById('tab-parser').style.color = tab === 'parser' ? 'white' : '#333';
    document.getElementById('tab-cleaner').style.background = tab === 'cleaner' ? '#0a66c2' : '#ccc';
    document.getElementById('tab-cleaner').style.color = tab === 'cleaner' ? 'white' : '#333';
  }

  function cleanCSV() {
    var repEmail = document.getElementById("repSelectCleaner").value;
    if (!repEmail) { alert("Please select a rep before cleaning!"); return; }

    var file = document.getElementById("csvFileInput").files[0];
    if (!file) { alert("Please upload a CSV file first!"); return; }

    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var rows = parseCSVRows(text);
      if (rows.length < 2) { alert("CSV appears to be empty!"); return; }

      var headers = rows[0];
      var dataRows = rows.slice(1);

      // Column index finder
      function col(name) { return headers.findIndex(function(h) { return h.trim() === name; }); }

      var iFirstName   = col("First Name") !== -1 ? col("First Name") : col("First Name (Linkedin)");
var iLastName    = col("Last Name") !== -1 ? col("Last Name") : col("Last Name (Linkedin)");
var iTitle       = col("Title") !== -1 ? col("Title") : col("Job Title (Linkedin)");
var iCompany     = col("Company") !== -1 ? col("Company") : col("Company Name (Linkedin)");
var iEmail       = col("Email (FullEnrich)");
var iAltEmail    = col("All Probably Valid Emails (FullEnrich)");
var iWebsite     = col("Company Website (Linkedin)") !== -1 ? col("Company Website (Linkedin)") : col("Website");
var iLeadSource  = col("LeadSource");
var iLinkedIn    = col("LinkedIn URL") !== -1 ? col("LinkedIn URL") : col("LinkedIn Profile Url") !== -1 ? col("LinkedIn Profile Url") : col("Linkedin Url");

      var results = [];
      dataRows.forEach(function(row) {
        if (row.length < 2) return; // skip blank rows
        results.push({
          firstName:    row[iFirstName]  || "",
          lastName:     row[iLastName]   || "",
          title:        row[iTitle]      || "",
          company:      accountOverride || row[iCompany] || "",
          email:        row[iEmail]      || "",
          altEmail:     row[iAltEmail]   || "",
          website:      row[iWebsite]    || "",
          leadSource:   row[iLeadSource] || "Outbound Prospecting",
          repEmail:     repEmail,
          linkedIn:     row[iLinkedIn]   || ""
        });
      });

      window.cleanedLeads = results;

      document.getElementById("cleanerOutput").innerHTML = "<p>✅ Cleaned <strong>" + results.length + " leads</strong> successfully!</p>";

      // Build table
      var outHeaders = ["First Name","Last Name","Title","Company","Email","Alternate Email","Website","Lead Source","Lead Owner Email","LinkedIn URL"];
      var keys = ["firstName","lastName","title","company","email","altEmail","website","leadSource","repEmail","linkedIn"];
      var html = "<table style='border-collapse:collapse; width:100%; font-size:13px;'>";
      html += "<tr>" + outHeaders.map(function(h) {
        return "<th style='background:#0a66c2;color:white;padding:8px 12px;text-align:left;white-space:nowrap;'>" + h + "</th>";
      }).join("") + "</tr>";
      results.forEach(function(r, idx) {
        var bg = idx % 2 === 0 ? "#ffffff" : "#f0f4ff";
        html += "<tr style='background:" + bg + ";'>";
        html += keys.map(function(k) {
          return "<td style='padding:8px 12px;border-bottom:1px solid #ddd;white-space:nowrap;'>" + (r[k] || "") + "</td>";
        }).join("");
        html += "</tr>";
      });
      html += "</table>";
      document.getElementById("cleanerTable").innerHTML = html;

      document.getElementById("cleanerDownload").innerHTML = "<button onclick='downloadCleanedCSV()' style='padding:10px 24px;background:#00a36c;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;'>⬇️ Download Cleaned CSV</button>";
    };
    reader.readAsText(file);
  }

  function parseCSVRows(text) {
    var rows = [];
    var row = [];
    var cell = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { cell += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(cell); cell = ""; }
        else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (c === '\r') { /* skip */ }
        else { cell += c; }
      }
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function downloadCleanedCSV() {
    var headers = ["First Name","Last Name","Title","Company","Email","Alternate Email","Website","Lead Source","Lead Owner Email","LinkedIn URL"];
    var keys = ["firstName","lastName","title","company","email","altEmail","website","leadSource","repEmail","linkedIn"];
    var csv = headers.join(",") + "\n";
    window.cleanedLeads.forEach(function(r) {
      csv += keys.map(function(k) {
        return '"' + (r[k] || "").replace(/"/g, '""') + '"';
      }).join(",") + "\n";
    });
    var blob = new Blob([csv], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "salesforce_ready_leads.csv";
    a.click();
  }
</script>

</body>
</html>
