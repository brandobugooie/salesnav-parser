<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Nav Lead Parser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #0a66c2;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 10px;
      padding: 10px 24px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #084e96;
    }
    #output {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Sales Nav Lead Parser</h1>
  <p>Paste your raw Sales Navigator copy below, then hit Parse.</p>

  <textarea id="rawInput" placeholder="Paste Sales Nav data here..."></textarea>
  <br>
  <button onclick="parseLeads()">Parse Leads</button>

  <div id="output"></div>

  <script>
    function parseLeads() {
      document.getElementById("output").innerHTML = "<p>It works! 🎉</p>";
    }
  </script>

</body>
</html>
