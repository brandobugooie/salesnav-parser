<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Nav Lead Parser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #0a66c2;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 10px;
      padding: 10px 24px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #084e96;
    }
    #output {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Sales Nav Lead Parser</h1>
  <p>Paste your raw Sales Navigator copy below, then hit Parse.</p>

  <textarea id="rawInput" placeholder="Paste Sales Nav data here..."></textarea>
  <br>
  <button onclick="parseLeads()">Parse Leads</button>

  <div id="output"></div>

  <script>
  function parseLeads() {
    var raw = document.getElementById("rawInput").value;
    var lines = raw.split("\n").map(function(l) { return l.trim(); });

    // Split into per-lead blocks
    var blocks = [];
    var current = [];

    for (var i = 0; i < lines.length; i++) {
      if (lines[i].match(/^Select /i) && current.length > 0) {
        blocks.push(current);
        current = [];
      }
      current.push(lines[i]);
    }
    if (current.length > 0) blocks.push(current);

    // Parse each block
    var results = [];

    blocks.forEach(function(b) {
      var name = b[1] || "";

      var connection = "";
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/^(1st|2nd|3rd)$/i)) { connection = b[i]; break; }
      }

      var lists = "";
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/\d+\s+Lists?$/i)) { lists = b[i]; break; }
      }

      var crmStatus = "";
      var crmIndex = -1;
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/CRM/i)) {
          crmStatus = b[i];
          crmIndex = i;
          break;
        }
      }
      if (crmIndex > 0 && b[crmIndex - 1] === "!") {
        crmStatus = "! " + crmStatus;
      }

      var title = "", company = "", extras = "", location = "";
      if (crmIndex !== -1) {
        var afterCRM = [];
        for (var i = crmIndex + 1; i < b.length; i++) {
          if (b[i].match(/^Add note$/i)) break;
          if (b[i] !== "") afterCRM.push(b[i]);
        }
        title   = (afterCRM[0] || "").replace(/^:\s*/, "");
        company = afterCRM[1] || "";
        if (afterCRM.length >= 3 && afterCRM[2].match(/^\(\+\d+\)$/)) {
          extras   = afterCRM[2];
          location = afterCRM[3] || "";
        } else {
          location = afterCRM[2] || "";
        }
      }

      var activity = "", date = "";
      for (var i = 0; i < b.length; i++) {
        if (b[i].match(/^No activity$/i)) {
          activity = b[i];
          for (var j = i + 1; j < b.length; j++) {
            if (b[j] !== "") { date = b[j]; break; }
          }
          break;
        }
      }

      results.push({ name, connection, title, company, extras, location, lists, crmStatus, activity, date });
    });

    // Store results globally for CSV download later
    window.parsedLeads = results;

    document.getElementById("output").innerHTML = "<p>✅ Parsed <strong>" + results.length + " leads</strong> successfully! Table coming in Stage 3.</p>";
  }
</script>

</body>
</html>
